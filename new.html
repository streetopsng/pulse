<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Survey — GummyGum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GUMMYGUM · PULSE SURVEY — visual system
   Bold black outlines, hard offset shadows, warm cream + orange.
   Flow/screens/logic unchanged — this is a skin, not a rebuild.
   ============================================================ */
:root{
  --bg:#FAF8FF;
  --surface:#FFFFFF;
  --surface-2:#F6F1FC;
  --ink:#1B1224;
  --ink-soft:#5B4F66;
  --ink-faint:#9C90A8;

  --accent:#7A4FE0;
  --accent-dark:#5C33B0;
  --accent-soft:#EFE4FB;
  --accent-tint:#D9C2F5;

  --gray-soft:#EFEAF7;
  --gray-ink:#6B5F78;

  --mint:#3FA66B;
  --mint-soft:#DFF3E7;

  --grape:#5B3E99;
  --grape-soft:#E6DCF7;

  --amber:#9457C7;
  --amber-soft:#F1E4FA;

  --line:#1B1224;
  --line-soft:#E8E0F5;

  --radius-s:10px;
  --radius-m:18px;
  --radius-l:26px;
  --radius-xl:34px;

  --bw:2px;
  --bw-lg:2.5px;

  --shadow-hard:4px 4px 0 var(--ink);
  --shadow-hard-sm:3px 3px 0 var(--ink);
  --shadow-hard-lg:6px 6px 0 var(--ink);
  --shadow-soft:0 10px 26px rgba(20,17,16,.08);

  --dur-1:150ms; --dur-2:230ms; --dur-3:400ms;
  --ease-out: cubic-bezier(.19,1,.22,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);

  --font-display:'Baloo 2', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
  background-image:
    radial-gradient(circle at 8% 10%, rgba(245,129,31,.05), transparent 40%),
    radial-gradient(circle at 92% 85%, rgba(245,129,31,.05), transparent 40%);
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; font-weight:700; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px;}
::selection{background:var(--accent-tint);}
code{font-family:var(--font-mono);}

/* faint background letters/icons, decorative texture */
.bg-deco{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.bg-deco span{
  position:absolute; font-family:var(--font-display); font-weight:800; color:var(--ink);
  opacity:.035; user-select:none;
}

/* ============ TOP SHELL ============ */
#topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 30px;
  background:var(--surface); border-bottom:var(--bw) solid var(--ink); position:sticky; top:0; z-index:30;
}
.tb-left{display:flex; align-items:center; gap:16px;}
.tb-mark{display:flex; align-items:center; gap:10px;}
.tb-logo{width:30px; height:30px;}
.tb-name{font-family:var(--font-display); font-weight:800; font-size:19px;}
.tb-crumb{font-family:var(--font-body); font-weight:600; font-size:12px; color:var(--ink-soft); letter-spacing:.02em; display:flex; align-items:center; gap:6px;}
.tb-crumb b{color:var(--ink); font-weight:800;}
.view-switch{display:flex; background:var(--surface); border:var(--bw) solid var(--ink); border-radius:99px; padding:4px; gap:3px;}
.view-switch button{border:none; background:none; padding:8px 16px; border-radius:99px; font-size:12.5px; font-weight:800; color:var(--ink-soft); transition:all var(--dur-2) var(--ease-out);}
.view-switch button.active{background:var(--accent); color:#fff; box-shadow:inset 0 0 0 var(--bw) var(--ink);}
.view-switch-label{font-size:9.5px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-right:4px;}

#app{min-height:calc(100vh - 66px); position:relative; z-index:1;}
.pane{padding:44px 32px 100px; max-width:1140px; margin:0 auto;}
.pane-narrow{max-width:740px;}
.fade-in{animation:fadeIn var(--dur-3) var(--ease-out);}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:99px;
  border:var(--bw-lg) solid var(--ink); font-size:14px; font-weight:800; font-family:var(--font-body);
  box-shadow:var(--shadow-hard-sm); transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); white-space:nowrap;
  background:var(--surface); color:var(--ink);
}
.btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink);}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.btn-primary{background:var(--accent); color:var(--ink);}
.btn-dark{background:var(--ink); color:#fff;}
.btn-ghost{background:var(--surface); color:var(--ink); box-shadow:none; border:var(--bw) solid var(--line-soft);}
.btn-ghost:hover{box-shadow:none; border-color:var(--ink); transform:none;}
.btn-mint{background:var(--mint); color:#fff;}
.btn-sm{padding:9px 16px; font-size:12.5px; border-width:var(--bw);}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface); border:var(--bw) solid var(--ink); box-shadow:var(--shadow-hard-sm);}
.btn-icon:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.btn[disabled]{opacity:.4; pointer-events:none; box-shadow:var(--shadow-hard-sm) !important; transform:none !important;}
.btn-text{background:none;border:none;color:var(--ink); font-weight:800; font-size:13px; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--accent); text-decoration-thickness:2px;}
.btn-text:hover{color:var(--accent-dark);}

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:99px; font-size:12.5px; font-weight:800;
  border:var(--bw) solid var(--ink); background:var(--surface); color:var(--ink); transition:all var(--dur-1) var(--ease-out);
}
.chip.active{background:var(--accent); color:var(--ink); box-shadow:var(--shadow-hard-sm);}
.chip:hover:not(.active){background:var(--accent-soft);}

.card-surface{background:var(--surface); border:var(--bw) solid var(--ink); border-radius:var(--radius-l); box-shadow:var(--shadow-hard);}

/* ============ INTRO ============ */
.eyebrow{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-body); font-weight:800; font-size:11.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:14px;
  background:var(--accent-soft); border:var(--bw) solid var(--ink); padding:6px 14px; border-radius:99px;
}
.intro-hero{text-align:center; padding:56px 20px 40px; max-width:640px; margin:0 auto; position:relative;}
.pulse-orb-wrap{width:150px; height:150px; margin:0 auto 30px; position:relative;}
.intro-hero h1{font-size:40px; margin-bottom:16px; line-height:1.15;}
.intro-hero h1 .hl{color:var(--accent);}
.intro-hero p{color:var(--ink-soft); font-size:16px; margin-bottom:30px; line-height:1.6;}
.meta-pill-row{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:30px; flex-wrap:wrap;}
.meta-pill{display:inline-flex; align-items:center; gap:8px; border:var(--bw) solid var(--ink); border-radius:99px; padding:9px 16px; font-size:13px; font-weight:700; background:var(--surface);}

/* ============ FIELDS ============ */
.field-block{margin-bottom:22px;}
.field-label{display:block; font-size:11.5px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;}
.field-input, .field-textarea, .field-select{width:100%; border:var(--bw) solid var(--ink); border-radius:var(--radius-s); padding:13px 15px; font-size:14px; font-family:var(--font-body); background:var(--surface); transition:box-shadow var(--dur-1);}
.field-input:focus, .field-textarea:focus{box-shadow:3px 3px 0 var(--accent); outline:none;}
.field-textarea{resize:vertical; min-height:66px;}

/* ============ TEMPLATE GALLERY ============ */
.tmpl-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px;}
.tmpl-card{
  text-align:left; background:var(--surface); border:var(--bw) solid var(--ink); border-radius:var(--radius-m);
  padding:19px; transition:all var(--dur-2) var(--ease-out); box-shadow:var(--shadow-hard-sm);
}
.tmpl-card:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink);}
.tmpl-card.selected{background:var(--accent-soft); box-shadow:var(--shadow-hard);}
.tmpl-ico{width:40px;height:40px;border-radius:12px; border:var(--bw) solid var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:13px; font-size:17px; background:var(--surface);}
.tmpl-t{font-family:var(--font-display); font-weight:700; font-size:16px; margin-bottom:5px;}
.tmpl-d{font-size:12.6px; color:var(--ink-soft); line-height:1.4;}
.tmpl-count{font-size:10.8px; font-weight:800; color:var(--ink-faint); margin-top:11px; text-transform:uppercase; letter-spacing:.03em;}

/* ============ STEPPER ============ */
.stepper{display:flex; align-items:center; gap:0; margin-bottom:36px; flex-wrap:wrap;}
.stepper .step{display:flex; align-items:center; gap:8px; padding:4px 2px;}
.stepper .num{width:24px;height:24px;border-radius:50%; background:var(--surface); border:var(--bw) solid var(--ink); color:var(--ink); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.stepper .step.done .num{background:var(--mint); color:#fff; border-color:var(--ink);}
.stepper .step.now .num{background:var(--accent); color:var(--ink);}
.stepper .txt{font-size:12px; font-weight:800; color:var(--ink-faint);}
.stepper .step.now .txt{color:var(--ink);}
.stepper .sep{width:22px; height:var(--bw); background:var(--ink); margin:0 5px; opacity:.25;}

/* ============ QUESTION BUILDER ============ */
.q-list{display:flex; flex-direction:column; gap:12px;}
.q-card{background:var(--surface); border:var(--bw) solid var(--ink); border-radius:var(--radius-m); overflow:hidden; transition:box-shadow var(--dur-1); box-shadow:var(--shadow-hard-sm);}
.q-head{display:flex; align-items:center; gap:12px; padding:15px 17px;}
.q-drag{cursor:grab; color:var(--ink-faint); font-size:15px; padding:2px;}
.q-num{font-weight:800; font-size:11px; color:var(--ink); background:var(--accent-soft); width:26px;height:26px;border-radius:8px; border:var(--bw) solid var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.q-summary{flex:1; min-width:0;}
.q-text{font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.q-type-row{display:flex; align-items:center; gap:8px; margin-top:3px;}
.q-type-badge{font-size:10.5px; font-weight:800; color:var(--ink); background:var(--gray-soft); padding:3px 10px; border-radius:99px; border:1.5px solid var(--ink);}
.q-required{font-size:10px; color:var(--accent-dark); font-weight:800;}
.q-actions{display:flex; gap:4px; flex-shrink:0;}
.q-actions button{width:32px;height:32px;border-radius:9px;border:1.5px solid transparent;background:transparent;color:var(--ink-faint); display:flex;align-items:center;justify-content:center; font-size:13px; transition:all var(--dur-1);}
.q-actions button:hover{background:var(--surface-2); border-color:var(--ink); color:var(--ink);}
.q-actions button.danger:hover{background:#FBE3E3; border-color:#B23838; color:#B23838;}
.q-body{max-height:0; overflow:hidden; transition:max-height var(--dur-2) var(--ease-out); border-top:0 solid var(--ink);}
.q-body.open{max-height:520px; border-top:var(--bw) solid var(--ink);}
.q-body-inner{padding:19px 17px 21px 53px; display:flex; flex-direction:column; gap:14px;}
.type-picker{display:flex; gap:8px; flex-wrap:wrap;}
.q-preview-box{background:var(--surface-2); border:2px dashed var(--ink); border-radius:var(--radius-m); padding:17px 19px;}
.q-preview-label{font-size:10px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:11px;}
.toggle-row{display:flex; align-items:center; justify-content:space-between;}
.switch{position:relative; width:38px; height:22px; border-radius:99px; background:var(--surface); border:var(--bw) solid var(--ink); flex-shrink:0; transition:background var(--dur-2);}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute; top:1.5px; left:1.5px; width:15px; height:15px; border-radius:50%; background:var(--ink); transition:transform var(--dur-2) var(--ease-out);}
.switch.on::after{transform:translateX(16px);}
.add-q-btn{border:2.5px dashed var(--ink); background:transparent; border-radius:var(--radius-m); padding:19px; font-size:14px; color:var(--ink); font-weight:800; transition:all var(--dur-1);}
.add-q-btn:hover{background:var(--accent-soft); border-style:solid;}

/* ============ RATING / LIKERT / CHOICE (reusable, bold pill style) ============ */
.rating-row{display:flex; gap:11px;}
.rating-opt{
  flex:1; aspect-ratio:1; max-width:60px; border-radius:16px; border:var(--bw-lg) solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:18px;
  transition:all var(--dur-2) var(--ease-spring); background:var(--surface); color:var(--ink); box-shadow:var(--shadow-hard-sm);
}
.rating-opt:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.rating-opt.picked{background:var(--accent); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.rating-scale-labels{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-top:10px;}

.likert-col{display:flex; flex-direction:column; gap:10px;}
.likert-opt{display:flex; align-items:center; gap:12px; padding:14px 17px; border:var(--bw) solid var(--ink); border-radius:var(--radius-m); background:var(--surface); transition:all var(--dur-1) var(--ease-out); font-size:14px; font-weight:700; box-shadow:var(--shadow-hard-sm);}
.likert-opt:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.likert-opt.picked{background:var(--accent-soft); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.likert-dot{width:19px;height:19px;border-radius:50%; border:var(--bw) solid var(--ink); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface);}
.likert-opt.picked .likert-dot{background:var(--accent);}
.likert-dot::after{content:''; width:8px;height:8px;border-radius:50%; background:var(--ink); opacity:0; transition:opacity var(--dur-1);}
.likert-opt.picked .likert-dot::after{opacity:1;}

.choice-col{display:flex; flex-direction:column; gap:10px;}
.choice-opt{display:flex; align-items:center; gap:12px; padding:14px 17px; border:var(--bw) solid var(--ink); border-radius:var(--radius-m); background:var(--surface); transition:all var(--dur-1); font-size:14px; font-weight:700; box-shadow:var(--shadow-hard-sm);}
.choice-opt:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.choice-opt.picked{background:var(--accent-soft); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.choice-mark{width:19px;height:19px; border:var(--bw) solid var(--ink); flex-shrink:0; background:var(--surface);}
.choice-mark.round{border-radius:50%;}
.choice-mark.square{border-radius:6px;}
.choice-opt.picked .choice-mark{background:var(--accent); position:relative;}
.choice-opt.picked .choice-mark.square::after{content:'✓'; color:var(--ink); font-size:12px; font-weight:800; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}

.open-text-box{width:100%; min-height:124px; border:var(--bw) solid var(--ink); border-radius:var(--radius-m); padding:17px; font-size:15px; font-family:var(--font-body); background:var(--surface); resize:none; transition:box-shadow var(--dur-1);}
.open-text-box:focus{box-shadow:3px 3px 0 var(--accent); outline:none;}
.char-count{text-align:right; font-size:11px; font-weight:700; color:var(--ink-faint); margin-top:7px;}

/* ============ CONFIG SCREEN ============ */
.delivery-cards{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:8px;}
.delivery-card{text-align:left; background:var(--surface); border:var(--bw) solid var(--ink); border-radius:var(--radius-l); padding:23px; transition:all var(--dur-2) var(--ease-out); box-shadow:var(--shadow-hard-sm);}
.delivery-card:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink);}
.delivery-card.selected{background:var(--accent-soft); box-shadow:var(--shadow-hard);}
.delivery-ico{width:44px;height:44px; border-radius:14px; border:var(--bw) solid var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:15px; font-size:20px; background:var(--surface);}
.delivery-t{font-family:var(--font-display); font-size:17px; font-weight:700; margin-bottom:7px;}
.delivery-d{font-size:13px; color:var(--ink-soft); line-height:1.5;}

.scope-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.scope-card{text-align:center; padding:17px; border:var(--bw) solid var(--ink); border-radius:var(--radius-m); background:var(--surface); transition:all var(--dur-1); box-shadow:var(--shadow-hard-sm);}
.scope-card.selected{background:var(--accent-soft); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.scope-n{font-family:var(--font-display); font-size:24px; font-weight:700;}
.scope-l{font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:3px;}

.privacy-cards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

/* ============ DEPLOY SUMMARY ============ */
.summary-card{background:var(--surface); border:var(--bw-lg) solid var(--ink); border-radius:var(--radius-xl); padding:36px 34px; box-shadow:var(--shadow-hard-lg); position:relative; overflow:hidden;}
.summary-card::before{content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%; background:var(--accent-soft); z-index:0;}
.summary-card > *{position:relative; z-index:1;}
.summary-row{display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:2px dashed var(--line-soft);}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{font-size:13.5px; color:var(--ink-soft); font-weight:700;}
.summary-row .v{font-size:14.5px; font-weight:800;}

/* ============ CONSOLE FRAME — signature "session" chrome ============ */
.console-frame{
  position:relative; background:var(--surface-2); border:var(--bw-lg) solid var(--ink); border-radius:28px;
  padding:38px 34px 30px; margin:6px 0 20px;
  clip-path:polygon(0 24px,24px 0,calc(100% - 24px) 0,100% 24px,100% calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,0 calc(100% - 24px));
}
.console-frame::before, .console-frame::after{
  content:''; position:absolute; top:-2.5px; width:52px; height:14px;
  background-image:repeating-linear-gradient(115deg, var(--accent) 0 6px, transparent 6px 11px);
  border-top:var(--bw-lg) solid var(--ink);
}
.console-frame::before{left:50%; transform:translateX(-50%);}
.console-frame::after{display:none;}
.console-dots{position:absolute; width:26px; height:26px; display:grid; grid-template-columns:repeat(2,1fr); gap:4px; z-index:2;}
.console-dots span{width:5px;height:5px;border-radius:50%; background:var(--accent);}
.console-dots.tl{top:10px; left:10px;} .console-dots.tr{top:10px; right:10px;}
.console-side{position:absolute; top:50%; transform:translateY(-50%); width:6px; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:space-between;}
.console-side.left{left:-3px;} .console-side.right{right:-3px;}
.console-side i{width:6px;height:6px;border-radius:1px; background:var(--accent);}
.console-side b{width:9px;height:9px;background:var(--accent); border:1.5px solid var(--ink);}
.console-title{text-align:center; margin-bottom:22px;}
.console-title .lbl{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
.console-title .name{font-family:var(--font-display); font-size:22px; font-weight:700; display:inline-flex; align-items:center; gap:10px;}
.console-title .name .dot{width:7px;height:7px;border-radius:50%; background:var(--accent);}

.stat-row-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
.stat-card{background:var(--surface); border:var(--bw) solid var(--ink); border-radius:var(--radius-m); padding:15px 17px; box-shadow:var(--shadow-hard-sm);}
.stat-card .lbl{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}

<body>
<div class="bg-deco" id="bgDeco"></div>
<div id="topbar">
  <div class="tb-left">
    <div class="tb-mark">
      <svg class="tb-logo" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12.5" fill="none" stroke="#1B1224" stroke-width="2"/><path d="M8.5 16.5c1.8 0 1.8-4 3.6-4s1.8 4 3.6 4 1.8-4 3.6-4 1.8 4 3.6 4" stroke="#7A4FE0" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="tb-name">Pulse Survey</span>
    </div>
    <div class="tb-crumb">TEAM ENGAGEMENT <span>›</span> <b>Pulse Survey</b></div>
  </div>
  <div class="view-switch">
    <span class="view-switch-label">Prototype</span>
    <button id="btnHostView" class="active" onclick="setTopView('host')">Host View</button>
    <button id="btnEmpView" onclick="setTopView('employee')">Employee View</button>
  </div>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   GUMMYGUM — PULSE SURVEY — interactive prototype
   Vanilla JS. Two sides (Host / Employee) sharing one data model.
   Host owns: Create → Build → Configure → Deploy → History/Analytics.
   Every pulse a Host creates lives in state.host.pulses, and each
   pulse's snapshot is computed from its own real responses[] array —
   not a separate faked results blob.
   ========================================================= */

/* ---------- question type meta ---------- */
const QTYPES = {
  rating:  {label:'Rating Scale',   icon:'★'},
  likert:  {label:'Likert',         icon:'≋'},
  single:  {label:'Single Choice',  icon:'◉'},
  multi:   {label:'Multiple Choice',icon:'▤'},
  open:    {label:'Open Text',      icon:'✎'},
};
const LIKERT_OPTIONS = ['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];

/* ---------- templates (each scored question carries a short
   "topic" — this is what powers the snapshot's category cards) ---------- */
const TEMPLATES = {
  team: {
    name:'Team Experience', icon:'🤝', color:'var(--accent)', bg:'var(--accent-soft)',
    desc:'A broad check-in on how the team is doing overall.',
    questions:[
      q('I feel supported by my team.','rating','Team Support'),
      q('My team communicates openly and honestly.','likert','Communication'),
      q('I feel a sense of belonging on this team.','rating','Belonging'),
      q('How connected do you feel to your teammates?', 'single', 'Connection', ['Very connected','Somewhat connected','Not very connected','Not connected at all']),
      q("What's one thing that would improve your experience at work?", 'open'),
    ]
  },
  manager: {
    name:'Manager Support', icon:'🧭', color:'var(--grape)', bg:'var(--grape-soft)',
    desc:'Understand how supported people feel by their manager.',
    questions:[
      q('My manager supports my growth.','rating','Growth Support'),
      q('I get useful feedback from my manager.','likert','Feedback'),
      q('I feel comfortable raising concerns with my manager.','rating','Psychological Safety'),
      q('What would help your manager support you better?','open'),
    ]
  },
  comm: {
    name:'Communication', icon:'💬', color:'var(--mint)', bg:'var(--mint-soft)',
    desc:'Check whether information flows clearly across the team.',
    questions:[
      q('I understand how decisions get made around here.','likert','Decision Clarity'),
      q('I have the information I need to do my job well.','rating','Information Flow'),
      q('Which channel works best for team updates?', 'single', null, ['Slack / chat','Email','Team meetings','Not sure']),
      q('Is there anything that feels unclear right now?','open'),
    ]
  },
  workload: {
    name:'Workload', icon:'⚖️', color:'var(--amber)', bg:'var(--amber-soft)',
    desc:"Get an honest read on capacity and pace.",
    questions:[
      q('My workload feels manageable right now.','rating','Workload'),
      q('I can take time off when I need to.','likert','Time Off'),
      q('How often do you work outside your normal hours?', 'single', 'Overtime', ['Never','Rarely','Sometimes','Often']),
      q("What's making your workload harder than it needs to be?",'open'),
    ]
  },
  wellbeing: {
    name:'Wellbeing', icon:'🌤️', color:'var(--accent)', bg:'var(--accent-soft)',
    desc:'A gentle pulse on how people are doing.',
    questions:[
      q('I feel energized by my work most days.','rating','Energy'),
      q('I have a healthy balance between work and life.','likert','Work-Life Balance'),
      q('I feel comfortable being open about how I\'m doing.','rating','Openness'),
      q('Anything on your mind we should know about?','open'),
    ]
  },
  connection: {
    name:'Team Connection', icon:'🌱', color:'var(--mint)', bg:'var(--mint-soft)',
    desc:'How connected people feel to each other and the mission.',
    questions:[
      q('I feel connected to the people I work with.','rating','Connection'),
      q('I understand how my work contributes to our goals.','likert','Purpose'),
      q('I feel proud to be part of this team.','rating','Pride'),
      q('What would help you feel more connected?','open'),
    ]
  },
  custom: {
    name:'Custom', icon:'✦', color:'var(--ink-soft)', bg:'var(--surface-2)',
    desc:'Start from a blank pulse and build it your way.',
    questions:[]
  }
};
function q(text,type,topic,options){
  const o = {id:'q'+Math.random().toString(36).slice(2,9), text, type, required:true, topic:topic||null};
  if(type==='rating') o.scaleMax=5;
  if(type==='single'||type==='multi') o.options = options || ['Option 1','Option 2','Option 3'];
  return o;
}
function cloneQuestions(list){ return list.map(x=>({...x, options:x.options? [...x.options]:undefined})); }

/* ---------- sample participants (used for the builder's people picker) ---------- */
const SAMPLE_PEOPLE = ['Alex Kim','Priya Nair','Jordan Lee','Sam Ortiz','Maya Chen','Diego Ruiz','Faith Adeyemi','Noah Becker','Lena Wolf','Theo Marsh'];

/* ---------- fake-respondent generation, used only to (a) seed pulse
   history so it isn't empty on first load, and (b) let a Host
   "simulate" additional responses arriving. Real employee submissions
   go through the exact same responses[] array, tagged isReal:true. ---------- */
const FAKE_COMMENTS = [
  'More clarity around priorities would help.',
  'I feel supported by my manager.',
  'Communication has improved recently.',
  "It's been a bit chaotic with the new tools.",
  'Pretty good overall, no complaints.',
  'Would love more recognition for good work.',
  'Team collaboration has been great this month.',
  'Workload feels heavier than usual lately.',
  'Escalation process could be clearer.',
  'I appreciate how open my manager is.',
];
function fakeRespondentAnswers(questions){
  const answers = {};
  questions.forEach(qq=>{
    if(qq.type==='rating') answers[qq.id] = Math.max(1, Math.min(5, Math.round(3.1 + (Math.random()*2-1)*1.7)));
    else if(qq.type==='likert') answers[qq.id] = Math.max(0, Math.min(4, Math.round(2.5 + (Math.random()*2-1)*1.6)));
    else if(qq.type==='single') answers[qq.id] = Math.floor(Math.random()*qq.options.length);
    else if(qq.type==='multi'){ const arr=[]; qq.options.forEach((o,i)=>{ if(Math.random()<0.45) arr.push(i); }); answers[qq.id]= arr.length? arr : [0]; }
    else if(qq.type==='open') answers[qq.id] = FAKE_COMMENTS[Math.floor(Math.random()*FAKE_COMMENTS.length)];
  });
  return answers;
}
function tagComment(text){
  const t = (text||'').toLowerCase();
  const attentionWords = ['hard','stress','unclear','confus','chaotic','overwhelm','burnout','no support','not enough','worse','difficult','heavier'];
  const positiveWords = ['good','great','support','improved','love','clear','helpful','proud','appreciate','well','open'];
  if(attentionWords.some(w=>t.includes(w))) return 'attention';
  if(positiveWords.some(w=>t.includes(w))) return 'positive';
  return 'neutral';
}

/* =========================================================
   SNAPSHOT COMPUTATION — the real analytics engine.
   Given a pulse (questions + responses[]), derive everything
   the results screen needs. No random numbers in here.
   ========================================================= */
function computeSnapshot(pulse){
  const responses = pulse.responses;
  const n = responses.length;
  const perQuestion = pulse.questions.map(qq=>{
    if(qq.type==='rating' || qq.type==='likert'){
      const vals = responses.map(r=>r.answers[qq.id]).filter(v=>v!=null);
      const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      const scoreOn5 = avg==null? null : (qq.type==='likert' ? +(1+avg).toFixed(1) : +avg.toFixed(1));
      return {q:qq, avg:scoreOn5, answered:vals.length};
    }
    if(qq.type==='single' || qq.type==='multi'){
      const dist = qq.options.map(()=>0);
      responses.forEach(r=>{
        const v = r.answers[qq.id];
        if(v==null) return;
        if(qq.type==='single') dist[v]++;
        else (v||[]).forEach(i=>dist[i]++);
      });
      return {q:qq, dist, answered:responses.filter(r=>r.answers[qq.id]!=null).length};
    }
    // open text
    const comments = responses
      .map(r=>({text:r.answers[qq.id], isReal:r.isReal}))
      .filter(c=>c.text && c.text.trim())
      .map(c=>({...c, tag:tagComment(c.text)}));
    return {q:qq, comments, answered:comments.length};
  });

  const categories = perQuestion
    .filter(pq=>pq.q.topic && pq.avg!=null)
    .map(pq=>({name:pq.q.topic, score:pq.avg}));

  const overall = categories.length
    ? +(categories.reduce((s,c)=>s+c.score,0)/categories.length).toFixed(1)
    : null;

  const allComments = perQuestion.filter(pq=>pq.q.type==='open').flatMap(pq=>pq.comments);

  return {perQuestion, categories, overall, allComments, responseCount:n};
}

/* ---------- app state ---------- */
function blankDraft(){
  return {
    name:'', description:'', template:null,
    questions:[], openQ:null,
    delivery:'private',
    scope:'team', participantCount:20,
    privacy:'anonymous',
    joinCode: String(Math.floor(100000+Math.random()*900000)).replace(/(\d{3})(\d{3})/,'$1 $2'),
  };
}
const state = {
  topView:'host',
  host:{
    screen:'welcome',
    draft: blankDraft(),
    pulses: [],
    activePulseId: null,
    snapshotPulseId: null,
    commentFilter:'all',
  },
  employee:{
    screen:'entry', joinInput:'',
    qIndex:0, answers:{},
    completedPulseIds: [],
  },
  previewOpen:false,
  preview:{qIndex:0, answers:{}},
};
function activePulse(){ return state.host.pulses.find(p=>p.id===state.host.activePulseId) || null; }
function snapshotPulse(){ return state.host.pulses.find(p=>p.id===state.host.snapshotPulseId) || null; }

/* ---------- boot / render root ---------- */
function setTopView(v){
  state.topView=v;
  document.getElementById('btnHostView').classList.toggle('active', v==='host');
  document.getElementById('btnEmpView').classList.toggle('active', v==='employee');
  if(v==='employee'){
    const ap = activePulse();
    if(ap && state.employee.completedPulseIds.includes(ap.id)){
      state.employee.screen = 'already';
    } else if(ap){
      state.employee.screen = ap.delivery==='live' ? 'join' : 'invite';
    }
  }
  render();
}
window.setTopView = setTopView;

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function render(){
  const app=document.getElementById('app');
  if(state.topView==='host'){
    app.innerHTML = HOST_RENDERERS[state.host.screen]();
  } else {
    app.innerHTML = EMP_RENDERERS[state.employee.screen]();
  }
  const post = state.topView==='host' ? HOST_POST[state.host.screen] : EMP_POST[state.employee.screen];
  if(post) post();
  if(state.previewOpen) renderPreviewModal();

/* =========================================================

function renderRating(qq, picked, onPick){
  const n = qq.scaleMax||5;
  let html = `<div class="rating-row">`;
  for(let i=1;i<=n;i++){
    html += `<button class="rating-opt ${picked===i?'picked':''}" onclick="${onPick}(${i})">${i}</button>`;
  }
  html += `</div><div class="rating-scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>`;
  return html;
}
function renderLikert(qq, picked, onPick){
  return `<div class="likert-col">${LIKERT_OPTIONS.map((o,i)=>`
    <button class="likert-opt ${picked===i?'picked':''}" onclick="${onPick}(${i})"><span class="likert-dot"></span>${o}</button>`).join('')}</div>`;
}
function renderChoice(qq, picked, onPick, multi){
  return `<div class="choice-col">${qq.options.map((o,i)=>{
    const isPicked = multi ? (picked||[]).includes(i) : picked===i;
    return `<button class="choice-opt ${isPicked?'picked':''}" onclick="${onPick}(${i})"><span class="choice-mark ${multi?'square':'round'}"></span>${o}</button>`;
  }).join('')}</div>`;
}
function renderOpen(val, oninput, id){
  return `<textarea class="open-text-box" id="${id}" placeholder="Type your answer…" oninput="${oninput}(this.value)">${val||''}</textarea><div class="char-count">${(val||'').length} characters</div>`;
}

      </div>
    </div>

    <div style="text-align:center; margin-top:14px;"><button class="btn-text" onclick="state.host.screen='home'; render();">← Back to your pulses</button></div>
  </div>`;
};
function liveAggregateHTML(qq,pq){
  if(qq.type==='rating') return `<div class="bignum-result">${pq.avg} <span style="font-size:16px;color:var(--ink-faint);">/ ${qq.scaleMax}</span></div>`;
  if(qq.type==='likert'){
    return `<div class="bignum-result">${pq.avg} <span style="font-size:16px;color:var(--ink-faint);">/ 5</span></div><p style="font-size:11.5px; color:var(--ink-faint); margin-top:6px; font-weight:600;">Average agreement across ${pq.answered} responses</p>`;
  }
  if(qq.type==='single'||qq.type==='multi'){
    const total = pq.dist.reduce((a,b)=>a+b,0)||1;
    return qq.options.map((o,i)=>{
      const pct = Math.round(pq.dist[i]/total*100);
      return `<div class="result-bar-row"><div class="result-bar-head"><span>${o}</span><span>${pct}%</span></div><div class="result-bar-track"><div class="result-bar-fill" style="width:${pct}%; background:var(--accent);"></div></div></div>`;
    }).join('');
  }
  // open
  return `<div style="display:flex;flex-direction:column;gap:10px;">${pq.comments.slice(0,3).map(c=>`<div class="comment-card" style="border-radius:12px;">${c.text}</div>`).join('') || '<p style="color:var(--ink-faint); font-size:13px;">No responses to this question yet.</p>'}</div>`;
}
function simulateLiveJoins(){
  const p = activePulse();
  const target = p.participantCount;
  const step = ()=>{
    if(p.responses.length < target){
      const batch = Math.ceil(target/6);
      for(let i=0;i<batch && p.responses.length<target;i++){
        p.responses.push({id:'r'+Math.random().toString(36).slice(2,9), answers:fakeRespondentAnswers(p.questions), isReal:false});
      }
      render();
      setTimeout(step, 350);
    }
  };
  step();
}
function nextLiveQuestion(){ activePulse().liveQIndex++; render(); }
function endLivePulse(){ activePulse().status='completed'; openSnapshot(activePulse().id); }
window.simulateLiveJoins=simulateLiveJoins; window.nextLiveQuestion=nextLiveQuestion; window.endLivePulse=endLivePulse;

        <p style="color:var(--ink-faint); font-size:12.5px; margin-top:4px; font-family:var(--font-mono);">${p.responses.length} responses · ${rate}% response rate ${statusBadgeHTML(p.status)}</p>
      </div>
      ${snap.overall!=null? `<div class="overall-score"><span class="n">${snap.overall}</span><span style="color:var(--ink-faint); font-size:13px;">/ 5 overall</span></div>` : ''}
    </div>

    ${snap.categories.length? `
    <div class="section-title">What's standing out</div>
    <div class="category-grid">
      ${snap.categories.map(c=>{
        const pct = c.score/5*100;
        const tag = c.score>=4? {t:'Strong area', c:'var(--mint)'} : (c.score<3.5? {t:'Needs attention', c:'var(--amber)'} : {t:'Steady', c:'var(--ink-faint)'});
        return `<div class="cat-card">
          <div class="cat-name"><span class="cat-dot" style="background:var(--accent)"></span>${c.name}</div>
          <div class="cat-score">${c.score}</div>
          <div class="cat-track"><div class="cat-fill" style="width:${pct}%; background:var(--accent);"></div></div>
          <span class="cat-tag" style="background:${tag.c}22; color:${tag.c};">${tag.t}</span>
        </div>`;
      }).join('')}
    </div>` : `<div class="card-surface" style="padding:22px; margin-top:10px;"><p style="color:var(--ink-faint); font-size:13.5px;">No responses yet — category scores will appear here once people start answering.</p></div>`}

    <div class="section-title">All questions asked</div>
    <div class="q-list">
    ${snap.perQuestion.map((pq,i)=>questionSnapshotRowHTML(pq,i)).join('')}
    </div>

    ${snap.allComments.length? `
    <div class="section-title">What your team is saying</div>
    <div class="comment-filters">
      ${['all','positive','neutral','attention'].map(f=>`<button class="chip ${state.host.commentFilter===f?'active':''}" onclick="setCommentFilter('${f}')">${f==='all'?'All':(f==='attention'?'Needs attention':f[0].toUpperCase()+f.slice(1))}</button>`).join('')}
    </div>
    <div class="comment-grid">
      ${filtered.map(c=>`<div class="comment-card">"${c.text}"${c.isReal? `<span title="Real submission" style="position:absolute; top:15px; left:15px; font-size:9px; font-weight:800; color:var(--accent-dark);">●</span>`:''}<span class="comment-tag" style="background:${c.tag==='positive'?'var(--mint)':(c.tag==='attention'?'var(--amber)':'var(--ink-faint)')};"></span></div>`).join('')}
    </div>` : ''}

    <div style="margin-top:34px;">
      <button class="btn btn-ghost" onclick="state.host.screen='home'; render();">← Back to your pulses</button>
    </div>

    <div class="dev-note">
      <b>Developer / design note — reuse in Change Metre</b><br>
      Pulse Survey is standalone: it owns the questions, response controls, the employee-facing experience, collection, history, and these results. Change Metre (a separate, standalone experience under Measure) owns scheduling and longitudinal comparison — it will later import the same Pulse blocks as a repeatable measurement inside a tracked timeline.
      <div class="flow-diagram">
        CHANGE METRE<br>
        &nbsp;&nbsp;Baseline<br>
        &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
        &nbsp;&nbsp;Pulse Survey<br>
        &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
        &nbsp;&nbsp;Checkpoint → Pulse Survey<br>
        &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
        &nbsp;&nbsp;Checkpoint → Pulse Survey<br>
        &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
        &nbsp;&nbsp;Endline → Compare Change

      Reusable blocks built here: Pulse welcome, question card, rating scale, Likert scale, choice question, open text question, progress indicator, navigation, completion screen, privacy notice, snapshot card, response distribution, comment card, pulse status card, and live session state. Each is implemented as an isolated render function (<code>renderRating</code>, <code>renderLikert</code>, <code>renderChoice</code>, <code>renderOpen</code>, <code>computeSnapshot</code>, the <code>phoneShell</code> wrapper, etc.) so Change Metre can call them directly against its own scheduling data rather than reimplementing them.

function questionSnapshotRowHTML(pq,i){
  const qq = pq.q;

  else if(qq.type==='single'||qq.type==='multi') summary = `<span class="q-type-badge">${pq.answered} answered</span>`;
  else summary = `<span class="q-type-badge">${pq.answered} comments</span>`;
  return `<div class="q-card" style="cursor:default;">
    <div class="q-head" style="cursor:default;">
      <span class="q-num">${String(i+1).padStart(2,'0')}</span>

      </div>
      ${summary}
    </div>
  </div>`;
}

/* =========================================================

   ========================================================= */
function openPreview(){
  state.previewOpen=true;
  state.preview = {qIndex:0, answers:{}};
  render();
}
function closePreview(){
  state.previewOpen=false;
  const modal = document.getElementById('previewModal');
  if(modal) modal.classList.remove('show');
  render();
}
window.openPreview=openPreview; window.closePreview=closePreview;

function renderPreviewModal(){
  let modal = document.getElementById('previewModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id='previewModal';
    modal.className='modal-overlay';
    document.body.appendChild(modal);
  }
  modal.classList.add('show');
  const qs = state.host.draft.questions;
  const p = state.preview;
  const qq = qs[p.qIndex];
  let body;
  if(!qq){
    body = `<div class="emp-center"><div class="emp-check-anim">✓</div><h2>Thanks for sharing.</h2><p>Your response has been recorded.</p></div>`;
  } else {
    const picked = p.answers[qq.id];
    let inputHTML='';
    if(qq.type==='rating') inputHTML = renderRating(qq,picked,'previewPick');
    else if(qq.type==='likert') inputHTML = renderLikert(qq,picked,'previewPick');
    else if(qq.type==='single') inputHTML = renderChoice(qq,picked,'previewPick');
    else if(qq.type==='multi') inputHTML = renderChoice(qq,picked,'previewPickMulti',true);
    else inputHTML = renderOpen(picked,'previewOpenInput','previewOpenBox') + `<div style="margin-top:16px; text-align:right;"><button class="btn btn-primary btn-sm" onclick="previewNext()">Next</button></div>`;
    body = `<div class="emp-qcount">Question ${p.qIndex+1} of ${qs.length}</div>
      <div class="emp-progress-track"><div class="emp-progress-fill" style="width:${(p.qIndex/qs.length)*100}%"></div></div>
      <div class="emp-qtext">${qq.text}</div>
      ${inputHTML}`;
  }
  modal.innerHTML = `<div style="position:relative;">
    <button class="btn btn-icon" style="position:absolute; top:-52px; right:0; background:#fff;" onclick="closePreview()">✕</button>
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="emp-mark">${logoSVG()}<span>PREVIEW · EMPLOYEE VIEW</span></div>
        ${body}
      </div>
    </div>
  </div>`;
}
function previewPick(i){ const p=state.preview; const qq=state.host.draft.questions[p.qIndex]; p.answers[qq.id]=i; renderPreviewModal(); setTimeout(previewNext,260); }
function previewPickMulti(i){
  const p=state.preview; const qq=state.host.draft.questions[p.qIndex];
  const arr = p.answers[qq.id] || [];
  const idx = arr.indexOf(i);
  if(idx>-1) arr.splice(idx,1); else arr.push(i);
  p.answers[qq.id]=arr; renderPreviewModal();
}
function previewOpenInput(v){ state.preview.answers[state.host.draft.questions[state.preview.qIndex].id]=v; }
function previewNext(){ state.preview.qIndex++; renderPreviewModal(); }
window.previewPick=previewPick; window.previewPickMulti=previewPickMulti; window.previewOpenInput=previewOpenInput; window.previewNext=previewNext;

/* =========================================================
   INIT — seed a small pulse history so Home isn't empty on
   first load: one pulse still collecting responses (so the
   Employee side has something live to answer for real), and
   two completed pulses with realistic historical data.
   ========================================================= */
(function seed(){
  function makePulse({name, description, template, delivery, participantCount, privacy, createdDate, status, respondentCount}){
    const questions = cloneQuestions(TEMPLATES[template].questions);
    const id = 'p'+Math.random().toString(36).slice(2,9);
    const responses = [];
    for(let i=0;i<respondentCount;i++){
      responses.push({id:'r'+Math.random().toString(36).slice(2,9), answers:fakeRespondentAnswers(questions), isReal:false});
    }
    return {
      id, name, description, template, questions, delivery, scope:'team',
      participantCount, privacy, joinCode:String(Math.floor(100000+Math.random()*900000)).replace(/(\d{3})(\d{3})/,'$1 $2'),
      status, createdDate, liveQIndex:0, responses,
    };
  }

  const activeOne = makePulse({
    name:'Team Experience Pulse', description:'A quick check-in on how the team is doing this month.',
    template:'team', delivery:'private', participantCount:20, privacy:'anonymous',
    createdDate:'Sep 20', status:'collecting', respondentCount:6,
  });
  const historyOne = makePulse({
    name:'Manager Support Check', description:'Understand how supported people feel by their manager.',
    template:'manager', delivery:'private', participantCount:15, privacy:'anonymous',
    createdDate:'Aug 12', status:'completed', respondentCount:13,
  });
  const historyTwo = makePulse({
    name:'Workload Pulse', description:'Get an honest read on capacity and pace.',
    template:'workload', delivery:'live', participantCount:24, privacy:'anonymous',
    createdDate:'Jul 3', status:'completed', respondentCount:24,
  });

  state.host.pulses = [activeOne, historyOne, historyTwo];
  state.host.activePulseId = activeOne.id;
})();

/* ---------- faint background texture ---------- */
(function renderBgDeco(){
  const el = document.getElementById('bgDeco');
  if(!el) return;
  const letters = ['X','H','I','D','C','V','U','O','N','S','R','T','B','E'];
  const spots = [];
  for(let i=0;i<16;i++){
    spots.push({
      ch: letters[Math.floor(Math.random()*letters.length)],
      top: Math.random()*95+'%', left: Math.random()*96+'%',
      size: 60+Math.random()*140,
    });
  }
  el.innerHTML = spots.map(s=>`<span style="top:${s.top}; left:${s.left}; font-size:${s.size}px;">${s.ch}</span>`).join('');
})();

/* ---------- employee entry default ---------- */
if(activePulse()){
  state.employee.screen = activePulse().delivery==='live' ? 'join' : 'invite';
}

render();
</script></body></html>
